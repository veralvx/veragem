AllCops:
  Exclude:
    - "result*/**/*" # `nix build`'s links: the gem installed, which the project index would take for a second copy
  NewCops: enable # pending cops on now, not only at the next major release
  ProjectIndexIncludesGems: true # the bundle's gems' sources indexed too: under `bundle exec rubocop` alone
  UseProjectIndex: true # the rubydex gem indexes the project: cops see across files (a method defined twice)

plugins:
  - rubocop-minitest
  - rubocop-packaging
  - rubocop-performance
  - rubocop-rake

inherit_mode:
  merge:
    - Exclude

Gemspec/DependencyVersion:
  Enabled: true

Layout/ClassStructure:
  Enabled: true
  ExpectedOrder:
    - module_inclusion
    - constants
    - public_attribute_macros
    - public_class_methods
    - initializer
    - public_methods
    - protected_attribute_macros
    - protected_methods
    - private_attribute_macros
    - private_class_methods
    - private_methods
  Categories:
    attribute_macros:
      - attr_accessor
      - attr_reader
      - attr_writer
    module_inclusion:
      - include
      - prepend
      - extend

Layout/EmptyLineAfterMultilineCondition:
  Enabled: true

Layout/EndOfLine: # LF, as .gitattributes checks every text file out, Windows' too; `native` wants CRLF there
  EnforcedStyle: lf

Layout/HeredocArgumentClosingParenthesis:
  Enabled: true

Layout/LeadingCommentSpace:
  AllowSteepAnnotation: true # Steep's inline annotations, `#: Type`, which have no space after the `#`

Style/TopLevelMethodDefinition: # a method on Object, everywhere; a script's helpers are its own
  Enabled: true
  Exclude:
    - Rakefile

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
