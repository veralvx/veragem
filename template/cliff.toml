# git-cliff: CHANGELOG.md from the Conventional Commits, written by `rake bump` (never by hand).
# Grouped by commit type, breaking changes first; what changes nothing a user meets (chores, CI,
# formatting, the release commit itself) is left out.
#
# It names no project: the Rakefile passes the repository the headings' compare links need
# (`--github-repo`, from the gemspec's source_code_uri). Run bare, the headings carry no link.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file, generated by
[git-cliff](https://git-cliff.org) from its commits; versions follow
[Semantic Versioning](https://semver.org).\n
"""
body = """
{% set url = "" -%}
{% if remote.github.owner -%}
    {% set url = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo -%}
{% endif -%}
{% if version -%}
    {% set number = version | trim_start_matches(pat="v") -%}
    ## {% if url %}[{{ number }}]({{ url }}/\
        {%- if previous.version %}compare/{{ previous.version }}..{{ version }}\
        {%- else %}tree/{{ version }}{% endif %})\
    {%- else %}{{ number }}{% endif %} - \
    {{ timestamp | date(format="%Y-%m-%d") }}
{% elif url and previous.version -%}
    ## [Unreleased]({{ url }}/compare/{{ previous.version }}..HEAD)
{% else -%}
    ## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.scope %}{{ commit.scope }}: {% endif %}\
          {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
# unconventional commits too: one cog takes (a body with no blank line before it) is listed by its
# type; one cog lets through (a merge, a fixup: cog.toml) is skipped, as is any of no type below
filter_unconventional = false
protect_breaking_commits = true # a breaking change is listed whatever its type, first
# by type, the HTML comments ordering the groups
commit_parsers = [
    { message = "^(fixup|squash|amend)! ", skip = true },
    { message = "^[a-z]+(\\([^)]*\\))?!:", group = "<!-- 0 -->Breaking changes" },
    { footer = "^BREAKING[ -]CHANGE", group = "<!-- 0 -->Breaking changes" },
    { message = "^(chore|ci|style)", skip = true },
    { message = "^feat", group = "<!-- 1 -->Features" },
    { message = "^fix", group = "<!-- 2 -->Fixes" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = "^refactor", group = "<!-- 4 -->Refactoring" },
    { message = "^build", group = "<!-- 5 -->Build" },
    { message = "^doc", group = "<!-- 6 -->Documentation" },
    { message = "^test", group = "<!-- 7 -->Tests" },
    { message = "^revert", group = "<!-- 8 -->Reverts" },
    { message = ".*", skip = true },
]
sort_commits = "oldest"
# the release tags, `v0.1.0` on (Bundler's own form, `rake release`)
tag_pattern = "^v[0-9]"
