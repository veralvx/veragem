# mutineer (`rake mutation`): every operator, not its default five; a minute a mutant, as a test that
# starts a process can take tens of seconds, and a mutant over the limit counts as neither caught
# nor survived.
operators:
  - arithmetic
  - comparison
  - boolean_connector
  - boolean_literal
  - statement_removal
  - return_nil
  - literal_mutation
  - condition_negation
  - string_literal
  - regex
  - collection_method
  - safe_navigation
  - range
  - negation_removal
  - chain_link
  - call_to_receiver
  - operand_removal
  - array_literal
  - condition_true
  - condition_false
  - operator_assignment
timeout: 60
