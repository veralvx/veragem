# The gems (Gemfile.lock), weekly; GitHub Actions, pinned to commits, each release in a comment,
# and Dependabot moves both (docs.github.com, "Dependabot supported ecosystems"), weekly; the
# flake's inputs, monthly.
version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # `chore(deps): ...` -- a Miscellaneous Task in the changelog, no feature or fix: the lock is not
    # in the gem, whose users resolve its gemspec's requirements themselves
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: # each created once (Issues > Labels): one the repository lacks is ignored
      - "dependencies"
      - "ruby"
    groups:
      # minor and patch updates in one pull request (dependabot-automerge.yml merges it once the
      # checks pass); a major one alone, for review
      gems:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # a release a week old at least, time for a compromised one to be found and yanked first
    # (zizmor's minimum; Dependabot's default is 3 days). A security update is not held back
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # `ci(deps): ...` -- nothing a user of the gem meets, so no changelog entry
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "actions"
    groups:
      actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  # the flake's inputs, monthly, in one pull request (Dependabot's `nix` ecosystem: each input to
  # its branch's newest commit). A person merges it: dependabot-automerge.yml takes patch and minor
  # bumps alone, and a commit's move is neither. An input in a private repository is not moved
  # (docs.github.com, "Supported ecosystems and repositories"): `nix flake update` by hand for it
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    # `chore(deps): ...` -- the flake is the development shell, the checks and the Nix package,
    # nothing RubyGems ships: a command's image takes the new inputs at its next release
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "nix"
    groups:
      flake-inputs:
        patterns:
          - "*"
    cooldown:
      default-days: 7
