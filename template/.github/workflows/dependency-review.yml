name: Dependency Review

# The licences and advisories of what a pull request adds to Gemfile.lock and the workflows, as the
# templates' Python and Rust ones review theirs. Advisory: it reports only when those files change,
# so no required check can be it, and dependabot-automerge.yml merges a bump it flags (security.yml's
# bundler-audit holds the lock daily).
on:
  pull_request:
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - "*.gemspec"
      - ".github/workflows/**"

permissions: {}

# NOTE: it needs the repository's dependency graph (Settings → Advanced Security), and on a
# private repository an organization's GitHub Code Security too: without them the job fails, not
# skips -- enable them, or delete the workflow.
#
# Gemfile.lock has no scopes, so each of its gems counts as runtime, the gemspec's dependencies and
# the Gemfile's tools alike. In effect, the actions are reviewed for licences alone: advisories
# match an action by semantic version, not the commit it is pinned to ("Dependency graph supported
# package ecosystems").
jobs:
  dependency-review:
    name: License & Security Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # no checkout: the action compares the pull request's base and head through GitHub's API
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # The licences are ClearlyDefined's, not the gemspecs'; a gem's:
          #   curl -s https://api.clearlydefined.io/definitions/gem/rubygems/-/NAME/VERSION
          # (.licensed.declared). Add what is legitimate and missing; never delete this list: an
          # empty allow-list allows everything.
          # Ruby: Ruby's own licence, with MIT or BSD's (concurrent-ruby, reline)
          allow-licenses: >
            0BSD, Apache-2.0, BlueOak-1.0.0, BSD-2-Clause, BSD-3-Clause,
            BSL-1.0, CC0-1.0, CC-BY-4.0, ISC, MIT, MIT-0, MPL-2.0,
            Ruby, Unlicense, Zlib
          # bundler-audit: GPL-3.0-or-later, a tool run here, never shipped. rake: MIT,
          # to which ClearlyDefined adds a warranty disclaimer it takes for a licence
          allow-dependencies-licenses: pkg:gem/bundler-audit, pkg:gem/rake
