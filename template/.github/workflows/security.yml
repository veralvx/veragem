# bundler-audit: Gemfile.lock against the Ruby Advisory Database -- daily, on demand, on every pull
# request and when main's lock changes (`rake audit`). A finding fails the run, notified to the
# workflow's creator (or whoever last changed its cron: docs.github.com, "Notifications for
# workflow runs"). GitHub disables a public repository's schedule after 60 days without activity
# ("Events that trigger workflows"): Dependabot alerts, the repository's setting, watch the lock
# without one.
name: Security

on:
  schedule:
    - cron: "23 3 * * *" # daily, 03:23 UTC: off the hour and midnight, when GitHub delays runs
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Gemfile.lock"
      - ".github/workflows/security.yml"
  # every pull request, whatever it touches: a check that always reports can be required, and
  # so gate a bump's auto-merge on the advisories
  pull_request:

# a pull request's newest run cancels its older ones; any other run, a group of its own: every
# commit on main checked (in a shared group, a pending run gives way to the newest: the default)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundler-audit:
    name: bundler-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: bundler-audit
        # the advisory database updated first, then the lock checked
        run: bundle exec rake audit
