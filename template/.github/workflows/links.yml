# The links of the files git tracks (`rake links`, lychee), monthly and on demand: a page moves or
# goes with nothing changed here. In the dev shell, whose lychee is the flake's; GITHUB_TOKEN, so
# GitHub's links are not rate-limited.
name: Links

on:
  schedule:
    - cron: "0 5 1 * *" # the 1st of each month, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: lychee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: rake links
        env:
          BUNDLE_FROZEN: "true"
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop --command bash -c "bundle install && bundle exec rake links"
