# The Ruby checks, `bundle exec rake` (RuboCop, Steep, the tests with their coverage gate,
# yard-lint), on each Ruby the matrix lists, on Linux, macOS and Windows, the gems installed from
# Gemfile.lock; then TypeProf's verdict, advisory. Beside them, the mutation test of every line: a
# change to the tests alone weakens them, and has no changed line to mutate.
# nix.yml runs the flake's checks: the Nix format, the shell, the workflows, the package.
name: Ruby CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a pull request's newest run cancels its older ones; any other run, a group of its own: every
# commit on main checked (in a shared group, a pending run gives way to the newest: the default)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Ruby ${{ matrix.ruby }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # the gemspec's required_ruby_version, and each newer Ruby once released
        ruby: ["4.0"]
    # Windows' default is PowerShell: the scripts below are bash, Git for Windows' there
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        # bundler-cache: `bundle install`, frozen to Gemfile.lock, cached
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: RuboCop, Steep, the tests, yard-lint
        env:
          RUBOCOP_OPTS: --format progress --format github
        run: bundle exec rake

      - name: RuboCop's safe corrections, as a patch
        # a failed run's: what `rake rubocop:autocorrect` changes, in the run's summary, to
        # `git apply` -- a Dependabot bump's too, which a failed run keeps from auto-merging
        if: failure()
        run: |
          bundle exec rake rubocop:autocorrect || true
          if ! git diff --quiet; then
            { echo '```diff'; git diff; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: TypeProf (advisory)
        run: bundle exec rake typeprof

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: mutineer, every line
        run: bundle exec rake mutation
