AllCops:
  EnabledByDefault: false # if all optional cops should be enabled or not
  Exclude:
    - "result*/**/*" # `nix build`'s links: the gem installed, which the project index would take for a second copy
  NewCops: enable # pending cops that will be enabled on the next release
  ProjectIndexIncludesGems: true # indexes the sources of every gem in the project’s bundle. Has effects only when running with bundle exec rubocop
  UseProjectIndex: true # uses rubydex gem: indexes the project -> sees across files (e.g. method defined twice)
  StringLiteralsFrozenByDefault: true
  TargetRubyVersion: 4.0

plugins:
  - rubocop-minitest
  - rubocop-packaging
  - rubocop-performance
  - rubocop-rake

inherit_mode:
  merge:
    - Exclude

Gemspec/DependencyVersion:
  Enabled: true

Layout/ClassStructure:
  Enabled: true
  ExpectedOrder:
    - module_inclusion
    - constants
    - association
    - public_attribute_macros
    - macros
    - public_class_methods
    - initializer
    - public_methods
    - protected_attribute_macros
    - protected_methods
    - private_attribute_macros
    - private_delegate
    - private_methods
  Categories:
    association:
      - has_many
      - has_one
    attribute_macros:
      - attr_accessor
      - attr_reader
      - attr_writer
    macros:
      - validates
      - validate
    module_inclusion:
      - include
      - prepend
      - extend

Layout/EmptyLineAfterMultilineCondition:
  Enabled: true

Layout/HeredocArgumentClosingParenthesis:
  Enabled: true

Layout/LeadingCommentSpace:
  AllowSteepAnnotation: true # Steep's inline annotations, `#: Type`, which have no space after the `#`

Style/TopLevelMethodDefinition: # Use raise with an explicit exception class and message, rather than just a message. Generally true, but not for scripts
  Enabled: true
  Exclude:
    - Rakefile

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
