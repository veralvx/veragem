# A Dependabot pull request that moves Gemfile.lock gets RuboCop's safe corrections (`rake
# rubocop:autocorrect`), when the bumped RuboCop finds any, as a commit of their own on its branch,
# then merges as any bump once its checks pass. No token is stored: the job's GITHUB_TOKEN pushes,
# and GitHub may hold the checks of that token's commit until a maintainer approves them (the pull
# request's "Approve workflows to run"); no workflow can start them sooner -- dispatched, theirs
# are not the pull request's required checks. `[dependabot skip]`: Dependabot rebases the bump
# still, over the commit, and this workflow corrects the new one.
name: RuboCop Autocorrect

on:
  pull_request:
    paths:
      - "Gemfile.lock"

permissions: {}

jobs:
  correct:
    name: Safe corrections
    # Dependabot's own branches alone: never a fork's, never a person's pull request
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # the bumped gems run here, so this job's token writes nothing: the next job, which pushes,
    # runs no gem
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.correct.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: RuboCop's safe corrections
        id: correct
        run: |
          set -euo pipefail
          # what is left once corrected fails CI's own RuboCop, for a person to fix
          bundle exec rake rubocop:autocorrect || true
          git diff --binary > "$RUNNER_TEMP/corrections.patch"
          if [[ -s $RUNNER_TEMP/corrections.patch ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the corrections
        if: steps.correct.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corrections
          path: ${{ runner.temp }}/corrections.patch
          if-no-files-found: error

  push:
    name: Commit them
    needs: correct
    if: needs.correct.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: The corrections
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corrections
          path: ${{ runner.temp }}

      - name: Commit and push
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          CORRECTED: ${{ github.event.pull_request.head.sha }}
          PATCH: ${{ runner.temp }}/corrections.patch
        run: |
          set -euo pipefail
          # corrections of the commit they were made on: on a newer one, Dependabot's or these
          # corrections', a re-run has nothing to do
          if [[ $(git rev-parse HEAD) != "$CORRECTED" ]]; then
            echo "$BRANCH is past $CORRECTED: corrected already, or a newer commit its own run corrects"
            exit 0
          fi
          # RuboCop's files alone, edited in place: nothing else the bumped gems could write
          ruby_files='^([^/]+/)*([^/]+\.(rb|gemspec)|Gemfile|Rakefile|Steepfile|(bin|exe)/[^/]+)$'
          if [[ -n $(git apply --summary "$PATCH") ]] ||
            git apply --numstat "$PATCH" | cut -f 3 | grep -Ev "$ruby_files"; then
            echo "::error::the corrections change more than RuboCop's files, in place: not committed"
            exit 1
          fi
          git apply "$PATCH"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --all --quiet --message "style: apply RuboCop's safe corrections [dependabot skip]"
          if ! git push origin "HEAD:$BRANCH"; then
            # refused because Dependabot pushed meanwhile, whose own run corrects its commit;
            # refused otherwise, a failure
            remote=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f 1)
            if [[ $remote == "$CORRECTED" ]]; then exit 1; fi
            echo "$BRANCH moved on: its own run corrects it"
          fi
