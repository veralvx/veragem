# A Dependabot pull request that moves Gemfile.lock gets RuboCop's safe corrections (`rake
# rubocop:autocorrect`), when the bumped RuboCop finds any, as a commit of their own on its branch;
# the checks then run on it, and dependabot-automerge.yml's merge follows as for any bump. No
# token is stored: the job's GITHUB_TOKEN pushes, whose push the pull request's workflows wait on a
# person's approval for -- creating no check meanwhile --, so it dispatches those whose checks are
# required, which run at once on the commit. `[dependabot skip]`: Dependabot rebases the bump still,
# over the commit, and this workflow corrects the new one.
name: RuboCop Autocorrect

on:
  pull_request:
    paths:
      - "Gemfile.lock"

permissions: {}

jobs:
  correct:
    name: Safe corrections
    # Dependabot's own branches alone: never a fork's, never a person's pull request
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # the bumped gems run here, so this job's token writes nothing: the next job, which pushes,
    # runs no gem
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.correct.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: RuboCop's safe corrections
        id: correct
        run: |
          set -euo pipefail
          # what is left once corrected fails CI's own RuboCop, for a person to fix
          bundle exec rake rubocop:autocorrect || true
          git diff --binary > "$RUNNER_TEMP/corrections.patch"
          if [[ -s $RUNNER_TEMP/corrections.patch ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the corrections
        if: steps.correct.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corrections
          path: ${{ runner.temp }}/corrections.patch
          if-no-files-found: error

  push:
    name: Commit them, then the checks
    needs: correct
    if: needs.correct.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the commit
      actions: write # the dispatches
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: The corrections
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corrections
          path: ${{ runner.temp }}

      - name: Commit, push, and dispatch the checks
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          CORRECTED: ${{ github.event.pull_request.head.sha }}
          MESSAGE: "style: apply RuboCop's safe corrections [dependabot skip]"
          PATCH: ${{ runner.temp }}/corrections.patch
        run: |
          set -euo pipefail
          if [[ $(git rev-parse HEAD) == "$CORRECTED" ]]; then
            # RuboCop's files alone, edited in place: nothing else the bumped gems could write
            ruby_files='^(([^/]+/)*[^/]+\.(rb|gemspec)|Gemfile|Rakefile|Steepfile|(bin|exe)/[^/]+)$'
            if [[ -n $(git apply --summary "$PATCH") ]] ||
              git apply --numstat "$PATCH" | cut -f 3 | grep -Ev "$ruby_files"; then
              echo "::error::the corrections change more than RuboCop's files, in place: not committed"
              exit 1
            fi
            git apply "$PATCH"
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --all --quiet --message "$MESSAGE"
            if ! git push origin "HEAD:$BRANCH"; then
              echo "$BRANCH moved on: its own run corrects it"
              exit 0
            fi
          elif [[ $(git rev-parse HEAD^) == "$CORRECTED" && $(git log -1 --format=%s) == "$MESSAGE" ]]; then
            echo "the corrections are pushed already (a re-run): the checks dispatched again"
          else
            echo "$BRANCH moved on since $CORRECTED: its own run corrects it"
            exit 0
          fi
          # the workflows whose checks a merge requires (dependabot-automerge.yml), each where it
          # exists, every one tried: keep the list with the required checks
          failed=0
          for workflow in ci.yml nix.yml smoke.yml style-check-cocogitto.yml style-check-dprint.yml; do
            if [[ -e .github/workflows/$workflow ]]; then
              gh workflow run "$workflow" --ref "$BRANCH" || failed=1
            fi
          done
          exit "$failed"
