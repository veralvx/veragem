# The plugin end to end (dev/smoke.sh): installed from this checkout, it generates a gem of each
# kind and licence, and each passes its own checks and is released, in this repository's dev shell
# -- the template's. Weekly too: the generated gems lock each gem's newest release (the dev shell's
# tools are flake.lock's), which can break them with nothing changed here. GitHub disables a public
# repository's schedule after 60 days without activity ("Events that trigger workflows").
name: Smoke

on:
  push:
    branches: [main]
  # every pull request, whatever it touches: a path-filtered workflow never reports, and a
  # required check that never reports blocks the merge
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 1" # Mondays, 05:37 UTC: GitHub delays the runs scheduled on the hour

# a pull request's newest run cancels its older ones; any other run, a group of its own: every
# commit on main checked (in a shared group, a pending run gives way to the newest: the default)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Generate and check each kind
    runs-on: ubuntu-latest
    # a run takes minutes; a hung download would otherwise hold this required check for 6 hours
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Smoke test
        run: nix develop --command dev/smoke.sh
