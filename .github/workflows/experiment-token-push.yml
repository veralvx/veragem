# TEMPORARY, removed in the next commit: does a GITHUB_TOKEN push to a pull request, followed by
# dispatches of the required workflows, leave the pull request mergeable? (rubocop-autocorrect.yml)
name: Experiment

on:
  pull_request:

permissions: {}

jobs:
  push:
    if: github.event.pull_request.number == 4
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ ! -e .github/experiment-marker ]]; then exit 0; fi
          git rm --quiet .github/experiment-marker
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "test: the experiment's push, made with GITHUB_TOKEN"
          git push origin "HEAD:$BRANCH"
          for workflow in ci.yml nix.yml smoke.yml style-check-cocogitto.yml style-check-dprint.yml; do
            gh workflow run "$workflow" --ref "$BRANCH"
          done
