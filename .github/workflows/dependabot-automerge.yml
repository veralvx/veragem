name: Dependabot Auto-Merge

# Repository settings, once:
# 1. Settings → General → Allow auto-merge: on.
# 2. Settings → Branches → a branch protection rule on main, its bypass to admins left allowed
#    (`rake release` pushes its commit and tag to main):
#      - Require a pull request before merging, no required approvals (one would hold every bump
#        for a person).
#      - Require status checks to pass before merging: every job the workflows run on every pull
#        request -- not one whose `pull_request:` has `paths:`, which reports only when those paths
#        change, so would block every other merge.
#    Without step 2, this workflow merges bumps no CI job gated: auto-merge waits for *required*
#    checks alone.
#
# The token needs only the `permissions:` below: the repository's default token permissions can
# stay read-only, and nothing here creates or approves a pull request. A merge this token makes
# starts no workflow run (GitHub's rule for GITHUB_TOKEN's events): main runs nothing for it; its
# pull request's required checks gated it.

on:
  pull_request:

permissions: {}

jobs:
  dependabot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # user.login, not github.actor: the account that opened the pull request, not whoever caused
    # the event (a person pushing to Dependabot's branch too).
    # Ref: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
    # github.actor: https://docs.github.com/en/actions/reference/workflows-and-actions/contexts
    #
    # To keep forks from auto-merging their own bumps, pin the repository:
    #     && github.repository == 'your-org/your-repo'
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        # update-type: the highest version-update:semver-{major,minor,patch} among the updated
        # dependencies whose level is known (Dependabot's metadata, else their versions); empty
        # when none is, which this condition refuses. A security update carries the same labels,
        # no "security:" prefix. To gate on security status, enable alert-lookup with a PAT or an
        # App's token (a Dependabot secret: a run Dependabot starts reads no other) and check
        # steps.metadata.outputs.alert-state (the first dependency's alert).
        if: >-
          contains(
            fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'),
            steps.metadata.outputs.update-type
          )
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
