# yard-lint's strict preset (https://github.com/mensfeld/yard-lint): each enabled validator an
# error, coverage at 100%.

AllValidators:
  # YARD command-line options (applied to all validators by default). The public API alone is
  # documented: .yardopts's query, which yard-lint's coverage reads too.
  YardOptions: []

  Exclude:
    - '\.git'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'spec/**/*'
    - 'test/**/*'

  # error, warning, convention or never
  FailOnSeverity: error

  # percent (0-100); a lower coverage fails
  MinCoverage: 100.0

  DiffMode:
    # --diff's base ref; ~ detects main or master
    DefaultBaseRef: ~

Documentation/UndocumentedObjects:
  Description: 'Checks for classes, modules, and methods without documentation.'
  Enabled: true
  Severity: error
  ExcludedMethods:
    - 'initialize/0'
    - '/^_/'          # private by convention
  # unset: ExcludedObjects, any object's full name (a constant's too): exact, name/arity or /regex/
  # ('MyApp::Api#call/1'); AllowedParentClasses (StandardError: its subclasses skipped)

Documentation/UndocumentedMethodArguments:
  Description: 'Checks for method parameters without @param tags.'
  Enabled: true
  Severity: error
  # each parameter matched to its @param by name: a misnamed @param caught
  CheckParameterNames: true
  # true skips a method with no documentation at all: Documentation/UndocumentedObjects reports it
  SkipFullyUndocumented: false
  # unset: AllowedParentClasses; AllowedMethods, skipped (exact name, name/arity or /regex/)

Documentation/UndocumentedBooleanMethods:
  Description: 'Checks that question mark methods document their boolean return.'
  Enabled: true
  Severity: error
  # unset: AllowedParentClasses

Documentation/UndocumentedOptions:
  Description: 'Detects methods with options hash parameters but no @option tags.'
  Enabled: true
  Severity: error
  # unset: AllowedParentClasses

Documentation/MissingReturn:
  Description: 'Requires @return tags on all methods (opt-in for strict documentation).'
  Enabled: true
  Severity: error
  ExcludedMethods:
    - 'initialize'
    # - '/^_/'        # private by convention, once uncommented
  # unset: AllowedParentClasses

Documentation/OrphanedDocComment:
  Description: 'Detects YARD comment blocks with tags not attached to any documentable construct.'
  Enabled: true
  Severity: error

Documentation/MarkdownSyntax:
  Description: 'Detects common markdown syntax errors in documentation.'
  Enabled: true
  Severity: error

Documentation/EmptyCommentLine:
  Description: 'Detects empty comment lines at the start or end of documentation blocks.'
  Enabled: true
  Severity: error
  EnabledPatterns:
    Leading: true
    Trailing: true

Documentation/BlankLineBeforeDefinition:
  Description: 'Detects blank lines between YARD documentation and method definition.'
  Enabled: true
  Severity: error
  OrphanedSeverity: error
  EnabledPatterns:
    SingleBlankLine: true
    OrphanedDocs: true
  # unset: IgnoredCommentPatterns, comment lines (/regex/ or a literal at word boundaries) taken for
  # no documentation, so no detached docstring above a blank line: commented-out code, FIXME notes

Documentation/LineLength:
  Description: 'Detects documentation comment lines that exceed the configured maximum length.'
  Enabled: false
  Severity: error
  MaxLength: 120

Documentation/UnderfilledLines:
  Description: 'Detects documentation prose that wraps before using the available line width.'
  Enabled: false  # heuristic; convention even in strict
  Severity: convention
  MaxLength: 120
  MinTrailingSpace: 20
  MinParagraphLines: 2
  SentenceEndChars: ['.', '?', '!', ':', ';']
  SkipNonAscii: true

Documentation/TextSubstitution:
  Description: 'Detects forbidden characters or strings in documentation and suggests replacements.'
  Enabled: true
  Severity: error
  Substitutions:
    "—": "-"    # em-dash (U+2014)
    "–": "-"    # en-dash (U+2013)

Documentation/DuplicateNamespaceComment:
  Description: 'Detects namespaces (modules and classes) documented in more than one file.'
  Enabled: true
  Severity: error

Documentation/ReferenceTypo:
  Description: 'Detects probable typos in method and constant references.'
  Enabled: true
  Severity: error

Tags/Order:
  Description: 'Enforces consistent ordering of YARD tags.'
  Enabled: true
  Severity: error
  EnforcedOrder:
    - param
    - option
    - yield
    - yieldparam
    - yieldreturn
    - return
    - raise
    - see
    - example
    - note
    - todo

Tags/InvalidTypes:
  Description: 'Validates type definitions in @param, @return, @option tags.'
  Enabled: true
  Severity: error
  YardOptions: [] # the public API alone, as the others: it reads every visibility otherwise
  ValidatedTags:
    - param
    - option
    - return
    - yieldreturn
    - yieldparam
    - raise
  # flags a CamelCase type neither a loaded constant nor defined in the code: a typo, or a
  # dependency's type, which ExtraTypes admits
  StrictConstantNames: true

Tags/TypeSyntax:
  Description: 'Validates YARD type syntax using YARD parser.'
  Enabled: true
  Severity: error
  ValidatedTags:
    - param
    - option
    - return
    - yieldreturn
    - yieldparam
    - raise

Tags/MeaninglessTag:
  Description: 'Detects @param/@option tags on classes, modules, or constants.'
  Enabled: true
  Severity: error
  CheckedTags:
    - param
    - option
  InvalidObjectTypes:
    - class
    - module
    - constant

Tags/MissingYield:
  Description: 'Detects methods that yield to a block without a @yield, @yieldparam, or @yieldreturn tag.'
  Enabled: true
  Severity: error
  YardOptions: [] # the public API alone, as the others: it reads every visibility otherwise

Tags/CollectionType:
  Description: 'Validates Hash collection syntax consistency.'
  Enabled: true
  Severity: error
  EnforcedStyle: long  # 'long' for Hash{K => V} (YARD standard), 'short' for {K => V}
  ValidatedTags:
    - param
    - option
    - return
    - yieldreturn
    - yieldparam
    - raise

Tags/TagTypePosition:
  Description: 'Validates type annotation position in tags.'
  Enabled: true
  Severity: error
  CheckedTags:
    - param
    - option
  # type_after_name, @param name [Type] (YARD's), or type_first, @param [Type] name
  EnforcedStyle: type_after_name

Tags/ApiTags:
  Description: 'Enforces @api tags on public objects.'
  Enabled: false
  Severity: error
  AllowedApis:
    - public
    - private
    - internal

Tags/OptionTags:
  Description: 'Requires @option tags for methods with options parameters.'
  Enabled: true
  Severity: error
  YardOptions: [] # the public API alone, as the others: it reads every visibility otherwise

Tags/ExampleSyntax:
  Description: 'Validates Ruby syntax in @example tags.'
  Enabled: true
  Severity: error
  # true skips @example console transcripts (irb or pry, `=>` output, `$` prompts): off, so no real
  # syntax error hides
  SkipNonRuby: false

Tags/ExampleStyle:
  Description: 'Validates code style in @example tags using RuboCop/StandardRB.'
  Enabled: false  # requires RuboCop or StandardRB
  Severity: convention
  # unset: Linter (auto, rubocop, standard or none); SkipPatterns, examples skipped ('/skip-lint/i')

Tags/RedundantParamDescription:
  Description: 'Detects meaningless parameter descriptions that add no value.'
  Enabled: true
  Severity: error
  CheckedTags:
    - param
    - option
  Articles:
    - The
    - the
    - A
    - a
    - An
    - an
  MaxRedundantWords: 6
  GenericTerms:
    - object
    - instance
    - value
    - data
    - item
    - element
  EnabledPatterns:
    ArticleParam: true
    PossessiveParam: true
    TypeRestatement: true
    ParamToVerb: true
    IdPattern: true
    DirectionalDate: true
    TypeGeneric: true
    ArticleParamPhrase: true

Tags/InformalNotation:
  Description: 'Detects informal tag notation patterns like "Note:" instead of @note.'
  Enabled: true
  Severity: error
  CaseSensitive: false
  RequireStartOfLine: true
  # true skips indented Markdown code blocks too, not only fenced ones: off, as list continuations
  # and wrapped prose are indented too
  SkipIndentedCodeBlocks: false
  Patterns:
    Note: '@note'
    IMPORTANT: '@note'
    Important: '@note'
    Todo: '@todo'
    TODO: '@todo'
    FIXME: '@todo'
    See: '@see'
    See also: '@see'
    Warning: '@note'
    Deprecated: '@deprecated'
    Author: '@author'
    Version: '@version'
    Since: '@since'
    Returns: '@return'
    Raises: '@raise'
    Example: '@example'

Tags/NonAsciiType:
  Description: 'Detects non-ASCII characters in type annotations.'
  Enabled: true
  Severity: error
  ValidatedTags:
    - param
    - option
    - return
    - yieldreturn
    - yieldparam
    - raise

Tags/TagGroupSeparator:
  Description: 'Enforces blank line separators between different YARD tag groups.'
  Enabled: false
  Severity: error
  TagGroups:
    param: [param, option]
    return: [return]
    error: [raise, throws]
    example: [example]
    meta: [see, note, todo, deprecated, since, version, api]
    yield: [yield, yieldparam, yieldreturn]
  RequireAfterDescription: false

Tags/TagSeparator:
  Description: 'Enforces a blank line between every consecutive YARD tag.'
  Enabled: false
  Severity: error
  Exempt: []
  RequireAfterDescription: false

Tags/ForbiddenTags:
  Description: 'Detects forbidden tag and type combinations.'
  Enabled: false
  Severity: error
  ForbiddenPatterns: []
  # e.g. {Tag: return, Types: [void]}; a Tag without Types forbids the tag outright

Tags/OverloadConsistency:
  Description: 'Checks the tags of each @overload against its own signature.'
  Enabled: true
  Severity: error

Warnings/SyntaxError:
  Description: 'Detects Ruby files YARD cannot parse (syntax errors).'
  Enabled: true
  Severity: error

Warnings/UnknownTag:
  Description: 'Detects unknown YARD tags.'
  Enabled: true
  Severity: error

Warnings/UnknownDirective:
  Description: 'Detects unknown YARD directives.'
  Enabled: true
  Severity: error

Warnings/InvalidTagFormat:
  Description: 'Detects malformed tag syntax.'
  Enabled: true
  Severity: error

Warnings/InvalidDirectiveFormat:
  Description: 'Detects malformed directive syntax.'
  Enabled: true
  Severity: error

Warnings/DuplicatedParameterName:
  Description: 'Detects duplicate @param tags.'
  Enabled: true
  Severity: error

Warnings/UnknownParameterName:
  Description: 'Detects @param tags for non-existent parameters.'
  Enabled: true
  Severity: error

Semantic/AbstractMethods:
  Description: 'Ensures @abstract methods do not have real implementations.'
  Enabled: true
  Severity: error
